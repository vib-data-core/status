<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" class="h-full">
  <head>
    {%- include head.html -%}
  </head>
  <body class="flex min-h-full flex-col font-sans">
    <a href="#main"
       class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-vib-900 focus:ring-2 focus:ring-vib-600">
      Skip to content
    </a>

    {%- comment -%}No top bar at all: the pages carry their own heading.{%- endcomment -%}
    <main id="main" class="flex-1">
      {{ content }}
    </main>

    {%- include footer.html -%}

    <script src="{{ '/assets/js/status.js' | relative_url }}" defer></script>
  </body>
</html>
