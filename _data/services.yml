# Controlled vocabulary for the `services_affected:` front matter field.
#
# These are the VIB Data Core services as listed in the Data Core catalogue.
# Use the `id` in front matter, e.g.
#   services_affected: [project-storage, usegalaxy]
#
# One announcement can cover several services. Adding a service = adding an
# entry here; script/validate.rb (and the check on every pull request) rejects
# ids that are not listed below. Ids are lowercase with dashes and should not
# change afterwards - they appear in shareable filter links such as
# ?services=usegalaxy,compute

- id: compute
  name: Compute

- id: secure-compute
  name: Secure Compute

- id: usegalaxy
  name: useGalaxy.be

- id: project-storage
  name: Project Storage

- id: eln
  name: Electronic Lab Notebook

- id: software-licenses
  name: Scientific Software licenses

- id: data-transfer
  name: Data Transfer Solutions

- id: data-deposition
  name: Data Deposition Toolbox

- id: dmp-platform
  name: DMP Platform
