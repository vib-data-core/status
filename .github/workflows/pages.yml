name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
# No scheduled rebuild needed: the browser recomputes which entries are
# ongoing, scheduled or closed from their timestamps (assets/js/status.js).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate front matter
        run: ruby script/validate.rb

      - name: Install Tailwind
        run: npm install --no-audit --no-fund

      - name: Build stylesheet
        run: npm run css

      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
