<!--
  A teal tile with the Lucide "megaphone" glyph in navy - the same icon the
  site uses for the word "announcement", and deliberately not a pulse line or
  a status dot: this is a notice board written by hand, not a monitor.
  The glyph is the 24x24 Lucide path, scaled and centred in the tile, with a
  heavier stroke so it still reads at 16px. No gradient, per the design notes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1cbbba"/>
  <g transform="translate(6 5.6) scale(0.8333)"
     fill="none" stroke="#001b39" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/>
    <path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/>
  </g>
</svg>
